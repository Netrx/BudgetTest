<div class="reports">
    <div class="reports-header">
        <h2>Отчеты и аналитика</h2>
        <p>Визуализация ваших доходов и расходов</p>
    </div>
    
    <div class="reports-grid">
        <!-- Расходы по категориям -->
        <div class="report-card">
            <h3>Расходы по категориям</h3>
            <div id="category-stats">
                <div class="loading-state">Загрузка...</div>
            </div>
        </div>
        
        <!-- Динамика по месяцам -->
        <div class="report-card">
            <h3>Динамика по месяцам</h3>
            <div class="chart-container">
                <canvas id="monthly-chart"></canvas>
            </div>
        </div>
        
        <!-- Распределение расходов -->
        <div class="report-card full-width">
            <h3>Распределение расходов</h3>
            <div class="chart-container">
                <canvas id="expense-pie-chart"></canvas>
            </div>
            <!-- Фильтры внизу -->
            <div style="margin-top: var(--spacing-lg); padding-top: var(--spacing-md); border-top: 1px solid var(--color-border);">
                <div style="display: flex; flex-direction: column; gap: var(--spacing-md); align-items: center;">
                    
                    <!-- Период -->
                    <div class="period-selector" style="display: flex; gap: 4px; background: var(--color-bg-secondary); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                        <button class="period-btn-pie" data-period="all" style="padding: 6px 14px; border: none; background: transparent; color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-family: var(--font-family);">Все</button>
                        <button class="period-btn-pie" data-period="year" style="padding: 6px 14px; border: none; background: transparent; color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-family: var(--font-family);">Год</button>
                        <button class="period-btn-pie" data-period="month" style="padding: 6px 14px; border: none; background: transparent; color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-family: var(--font-family);">Месяц</button>
                        <button class="period-btn-pie active" data-period="custom" style="padding: 6px 14px; border: none; background: transparent; color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-family: var(--font-family);">Выбрать</button>
                    </div>
                    
                    <!-- Поля для выбора дат -->
                    <div id="pie-custom-dates" style="display: flex; flex-direction: column; align-items: center; gap: var(--spacing-sm);">
                        <div style="display: flex; align-items: center; gap: var(--spacing-sm); background: var(--color-bg-secondary); padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                            <input type="date" id="report-pie-date-start" style="padding: 6px 10px; border: none; background: transparent; color: var(--color-text); font-family: var(--font-family); font-size: var(--font-size-xs); min-width: 130px; outline: none;">
                            <span style="color: var(--color-text-secondary); font-size: var(--font-size-sm); font-weight: 500; padding: 0 4px;">—</span>
                            <input type="date" id="report-pie-date-end" style="padding: 6px 10px; border: none; background: transparent; color: var(--color-text); font-family: var(--font-family); font-size: var(--font-size-xs); min-width: 130px; outline: none;">
                        </div>
                        <button id="apply-pie-dates" style="padding: 6px 16px; background: var(--color-text); color: var(--color-bg); border: 1px solid var(--color-text); border-radius: var(--radius-sm); font-family: var(--font-family); font-size: var(--font-size-xs); font-weight: 500; cursor: pointer; transition: var(--transition); white-space: nowrap;">Применить</button>
                    </div>
                    
                    <!-- Категории в виде кнопок -->
                    <div style="display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 8px 10px; background: var(--color-bg-secondary); border-radius: var(--radius-sm); border: 1px solid var(--color-border); width: 100%; box-sizing: border-box;" id="category-filter-buttons">
                        <!-- Заполняется через JS -->
                    </div>
                    
                    <button id="apply-pie-filters" style="padding: 6px 16px; background: var(--color-text); color: var(--color-bg); border: 1px solid var(--color-text); border-radius: var(--radius-sm); font-family: var(--font-family); font-size: var(--font-size-xs); font-weight: 500; cursor: pointer; transition: var(--transition); white-space: nowrap;">Применить</button>
                </div>
            </div>
        </div>
    </div>
</div>
